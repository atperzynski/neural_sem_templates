#
# Two checks on every push and pull request: no file of data has been committed, and the model in
# model/model.lav is valid lavaan syntax. The data are never in the repository, so the model is
# parsed rather than fitted; analysis.R fits it on a computer that holds the data.
name: check

on:
  push:
  pull_request:

jobs:
  no-data:
    name: No data in the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/check_no_data.py

  model:
    name: The model parses in lavaan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Parse model/model.lav
        run: |
          if [ ! -f model/model.lav ]; then echo "No model has been saved to this project yet."; exit 0; fi
          Rscript -e 'install.packages("lavaan", quiet = TRUE); pt <- lavaan::lavaanify(paste(readLines("model/model.lav"), collapse = "\n")); cat(nrow(pt), "rows in the parameter table, so the model syntax parses.\n")'
